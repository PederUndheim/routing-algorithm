name: Deploy consensus API

# Builds the consensus meeting app's backend image, checks it starts and
# keeps the track tiles behind the access code, pushes it to GHCR and points
# the Azure Container App at it. See skimap/deploy/consensus.sh for the Azure
# side. Separate from the validation API on purpose: nothing here touches it.

on:
  push:
    branches: ["main"]
    paths:
      - "skimap/consensus_app/backend/**"
      - "skimap/consensus_app/Dockerfile"
      - "skimap/consensus_app/__init__.py"
      - ".github/workflows/deploy-consensus-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: consensus-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pederundheim/skimap-consensus-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build --build-arg VERSION=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" skimap/consensus_app

      # On the file store and a stand-in validation dump, since there is no
      # storage account here.
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:${{ github.sha }}" python -c "import azure.data.tables, azure.storage.blob, azure.core.credentials; from consensus_app.backend import server, snapshots, experts"
          mkdir -p /tmp/tracks/13/1 /tmp/experts && printf 'png' > /tmp/tracks/13/1/2.png
          echo '{"version": 1, "tiles": {"13": ["1/2"]}}' > /tmp/tracks/index.json
          echo '{"current": []}' > /tmp/experts/dump.json
          docker run -d --name api -p 8000:8000 -e CONSENSUS_ACCESS_CODE=ci -e CONSENSUS_ADMIN_KEY=ci \
            -e CONSENSUS_TRACKS_DIR=/app/tracks -v /tmp/tracks:/app/tracks:ro \
            -e CONSENSUS_EXPERTS_FILE=/app/experts/dump.json -v /tmp/experts:/app/experts:ro \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 20); do curl -fs localhost:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8000/tiles/tracks/13/1/2.png")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8000/tiles/tracks/13/1/2.png?code=ci")" = 200
          curl -fs -H "X-Access-Code: ci" localhost:8000/api/meetings | python3 -c "import json, sys; m = json.load(sys.stdin); assert all(x['corridors'] for x in m), 'a meeting without corridors'"
          curl -fs -H "X-Access-Code: ci" "localhost:8000/api/experts?meeting=m20261123"
          docker rm -f api

      - name: Push
        run: docker push --all-tags "$IMAGE"

  deploy:
    needs: build
    # Off until the app exists - see skimap/deploy/consensus.sh.
    if: vars.CONSENSUS_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the Container App at the new image
        run: |
          az containerapp update \
            --name skimap-consensus \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE:${{ github.sha }}"

      # A failed startup probe leaves the old revision serving and the step
      # above green, so ask the live app which commit it is running.
      - name: Check the new revision is live
        run: |
          for i in $(seq 30); do
            live=$(curl -s -m 20 "${{ vars.CONSENSUS_API_URL }}/health" \
              | python3 -c "import json, sys; print(json.load(sys.stdin).get('version', ''))" || true)
            [ "$live" = "${{ github.sha }}" ] && { echo "live: $live"; exit 0; }
            sleep 10
          done
          echo "the API runs ${live:-nothing}, not ${{ github.sha }}" >&2
          exit 1
