name: Deploy skimap frontend to GitHub Pages

# One Pages site, two apps: the skimap app at /routing-algorithm/ and the
# validation app at /routing-algorithm/validering/. Pages takes one artifact
# per deploy, so a change to either rebuilds both.

on:
  push:
    branches: ["main"]
    paths:
      - "skimap/app/frontend/**"
      - "skimap/validation_app/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skimap/app/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            skimap/app/frontend/package-lock.json
            skimap/validation_app/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Pages serves the site under the repo name. The base is passed here
      # rather than set in vite.config.ts, so the dev server still serves
      # from the root.
      - name: Build
        run: npm run build -- --base=/routing-algorithm/

      # Off until the API exists - see skimap/deploy/validation.sh. Built
      # into the main app's dist, so it rides along in the one artifact.
      - name: Validation app
        if: vars.VALIDATION_API_URL != ''
        working-directory: skimap/validation_app/frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VALIDATION_API_URL }}
        run: |
          npm ci
          npm test
          npm run build -- --base=/routing-algorithm/validering/ --outDir ../../app/frontend/dist/validering --emptyOutDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: skimap/app/frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
