name: Deploy skimap frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "skimap/app/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skimap/app/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skimap/app/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Pages serves the site under the repo name. The base is passed here
      # rather than set in vite.config.ts, so the dev server still serves
      # from the root.
      - name: Build
        run: npm run build -- --base=/routing-algorithm/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: skimap/app/frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
